channel_mode: rgb
classifier: CatBoost
clf_depth: 5
clf_iterations: 100
clf_learning_rate: 0.1
clf_use_gpu: null
fe_layers:
- features.0 Conv2d(3, 64, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))
fe_name: vgg16
fe_order: 0
fe_scalings:
- 1
- 2
- 4
fe_use_gpu: null
fe_use_min_features: false
image_downsample: 1
normalize: 3
seg_smoothening: 1
tile_annotations: true
tile_image: false
unpatch_order: 1
use_dask: false
